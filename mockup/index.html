<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Launcher Mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;}
#stage{width:1280px;height:720px;transform-origin:center center;}
button{font-family:inherit}
:root{--ink:#ececf1;--sub:rgba(236,236,241,.62);--glass:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--track:rgba(255,255,255,.12);--shadow:0 20px 50px rgba(0,0,0,.45);--onbtn:rgba(255,255,255,.12);--playink:#050508;
--bg:radial-gradient(ellipse at 10% 0%,rgba(84,58,150,.32) 0%,rgba(84,58,150,0) 50%),radial-gradient(ellipse at 95% 5%,rgba(28,64,140,.28) 0%,rgba(28,64,140,0) 50%),radial-gradient(ellipse at 75% 105%,rgba(150,62,38,.2) 0%,rgba(150,62,38,0) 50%),#050508;}
.light{--ink:#15151d;--sub:rgba(21,21,29,.62);--glass:rgba(255,255,255,.5);--border:rgba(255,255,255,.85);--track:rgba(21,21,29,.12);--shadow:0 14px 40px rgba(40,40,80,.08);--onbtn:rgba(21,21,29,.08);--playink:#fff;
--bg:radial-gradient(ellipse at 10% 0%,#f7d5cc 0%,rgba(247,213,204,0) 50%),radial-gradient(ellipse at 95% 5%,#cdd6fb 0%,rgba(205,214,251,0) 50%),radial-gradient(ellipse at 75% 105%,#fbe3c6 0%,rgba(251,227,198,0) 50%),#eff0f5;}
.photo{--bg:linear-gradient(135deg,#1c1c22,#0b0b0f);}
.light.photo{--bg:linear-gradient(135deg,#e4e4ea,#d0d1d8);}
.root{width:1280px;height:720px;position:relative;overflow:hidden;font-family:Inter,system-ui,sans-serif;font-weight:300;color:var(--ink);background:var(--bg);transition:background .4s}
.glass{background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}
.card{box-sizing:border-box;border-radius:28px;box-shadow:var(--shadow)}
.sub{font-size:15px;color:var(--sub)}.small{font-size:13px;color:var(--sub)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;letter-spacing:.3px;color:var(--sub)}
.track{height:3px;border-radius:3px;background:var(--track)}.fill{height:3px;border-radius:3px;background:var(--ink)}
.pill{position:absolute;left:32px;top:50%;transform:translateY(-50%);width:60px;box-sizing:border-box;padding:10px 8px;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow)}
.ib{width:44px;height:44px;border-radius:50%;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--sub);transition:background .2s,color .2s}
.ib.on{background:var(--onbtn);color:var(--ink)}
.div{width:22px;height:1px;margin:6px 0;background:var(--track)}
.ctrl{width:40px;height:40px;border-radius:50%;border:0;padding:0;cursor:pointer;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center}
.play{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:var(--ink);color:var(--playink);display:flex;align-items:center;justify-content:center}
.mini{border-radius:24px;cursor:pointer;padding:16px;color:var(--ink);display:flex;gap:14px;align-items:center;min-width:0;text-align:left}
.app{border-radius:22px;cursor:pointer;padding:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:box-shadow .2s}
.photolabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S={theme:'dark',bg:'gradient',nav:'home',picked:'youtube',playing:true,pos:83};
const I={
home:'<path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
music:'<path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
live:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M9 3l3 3 3-3"/>',
apps:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
games:'<path d="M7 7h10a4 4 0 0 1 3.9 4.8l-1 4.7a2 2 0 0 1-3.5.8L14.5 15h-5l-1.9 2.3a2 2 0 0 1-3.5-.8l-1-4.7A4 4 0 0 1 7 7z"/><path d="M8 10v3M6.5 11.5h3"/>',
wifi:'<path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.2" r=".8" fill="currentColor"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
image:'<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8.5"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
prev:'<path d="M18 6l-8 6 8 6zM6 6v12"/>',next:'<path d="M6 6l8 6-8 6zM18 6v12"/>'};
const svg=(k,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
const NAV=[['home','Home'],['search','Search'],['music','Music'],['live','Live TV'],['apps','All apps'],['games','Games']];
const APPS=[['youtube','YouTube','#ff3b3b'],['iplayer','iPlayer','#ff4fa3'],['itvx','ITVX','#e6c341'],['c4','Channel 4','#47c98f'],['my5','My5','#4f8fff'],['prime','Prime Video','#38b6f0'],['ytmusic','YT Music','#ff5a5a']];
const ALSO=[['Prime Video','Northbound','1h 12m left',38,'linear-gradient(150deg,#3b5f8a,#121a2c)'],['ITVX','Kitchen Nights','S1 · E2 · 8 min left',84,'linear-gradient(150deg,#b0743a,#3a1f14)']];
const pad=x=>String(x).padStart(2,'0');
function render(){
 const n=new Date(),dark=S.theme==='dark',photo=S.bg==='photo';
 const date=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
 document.getElementById('stage').innerHTML=`
<div class="root ${dark?'':'light'} ${photo?'photo':''}">
${photo?'<div class="photolabel">[ Your photo wallpaper here ]</div>':''}
<nav class="pill glass" aria-label="Main">
${NAV.map(([id,l])=>`<button class="ib ${S.nav===id?'on':''}" data-nav="${id}" aria-label="${l}">${svg(id)}</button>`).join('')}
<div class="div"></div>
<button class="ib" aria-label="Wi-Fi">${svg('wifi')}</button>
<button class="ib" data-act="theme" aria-label="${dark?'Switch to light mode':'Switch to dark mode'}">${svg(dark?'sun':'moon')}</button>
<button class="ib" data-act="bg" aria-label="${photo?'Use gradient wallpaper':'Use photo wallpaper'}">${svg('image')}</button>
<button class="ib" aria-label="Settings">${svg('gear')}</button>
</nav>
<div style="position:absolute;left:128px;right:48px;top:36px;display:flex;justify-content:space-between;align-items:baseline">
<div style="display:flex;align-items:baseline;gap:18px"><div style="font-size:52px;font-weight:200;letter-spacing:-1px;line-height:1">${pad(n.getHours())}:${pad(n.getMinutes())}</div><div class="sub">${date}</div></div>
<div class="sub">12° · Partly cloudy</div></div>
<div style="position:absolute;left:128px;right:48px;top:112px;height:432px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px">
<div style="display:flex;flex-direction:column;gap:16px;min-width:0">
<section class="card glass" aria-label="Now playing" style="height:262px;padding:22px;display:flex;flex-direction:column;justify-content:space-between">
<div class="eyebrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg><span>Now playing · YouTube Music</span></div>
<div style="display:flex;gap:20px;align-items:center"><div style="width:112px;height:112px;flex:none;border-radius:16px;background:linear-gradient(140deg,#e8735a 0%,#8b3a7a 55%,#2c1d4f 100%);box-shadow:0 10px 30px rgba(0,0,0,.35)"></div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="font-size:22px;font-weight:400">Late Night Static</div><div class="sub">Neon Harbour</div></div></div>
<div style="display:flex;flex-direction:column;gap:12px"><div class="track"><div class="fill" style="width:${Math.round(S.pos/222*100)}%"></div></div>
<div style="display:flex;justify-content:space-between;align-items:center"><span class="small">${Math.floor(S.pos/60)}:${pad(S.pos%60)}</span>
<div style="display:flex;gap:8px;align-items:center"><button class="ctrl" aria-label="Previous">${svg('prev',18)}</button>
<button class="play" data-act="play" aria-label="${S.playing?'Pause':'Play'}">${S.playing?'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5.5" width="3.2" height="13" rx="1"/><rect x="13.8" y="5.5" width="3.2" height="13" rx="1"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>'}</button>
<button class="ctrl" aria-label="Next">${svg('next',18)}</button></div><span class="small">3:42</span></div></div>
</section>
<section class="card glass" aria-label="Weather" style="flex:1 1 0;padding:22px;display:flex;justify-content:space-between">
<div style="display:flex;flex-direction:column;justify-content:space-between"><div class="eyebrow"><span>[Your town]</span></div>
<div style="font-size:64px;font-weight:200;line-height:1;letter-spacing:-2px">12°</div><div class="small">Partly cloudy · H 14° L 8°</div></div>
<svg width="96" height="96" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="align-self:center;opacity:.85"><circle cx="18" cy="17" r="6"/><path d="M18 6v2.5M7 17h2.5M10.2 9.2l1.8 1.8M25.8 9.2L24 11"/><path d="M16 36h20a6 6 0 0 0 0-12 8.5 8.5 0 0 0-16.2 2.5A5 5 0 0 0 16 36z"/></svg>
</section></div>
<div style="display:flex;flex-direction:column;gap:16px;min-width:0">
<section class="card glass" aria-label="Continue watching" style="height:280px;position:relative;overflow:hidden;padding:0">
<div style="position:absolute;inset:0;background:linear-gradient(130deg,#1e6a7a 0%,#24315e 50%,#4a1f4e 100%)"></div>
<div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(4,4,8,.85) 0%,rgba(4,4,8,.2) 60%,rgba(4,4,8,0) 100%)"></div>
<div style="position:absolute;left:24px;top:20px;font-size:13px;font-weight:400;letter-spacing:.4px;color:rgba(255,255,255,.8)">Continue watching</div>
<div style="position:absolute;left:24px;right:24px;bottom:22px;display:flex;flex-direction:column;gap:10px;color:#fff">
<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.75)"><span style="width:8px;height:8px;border-radius:50%;background:#ff4fa3"></span>BBC iPlayer</div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px"><div><div style="font-size:30px;font-weight:300">The Coastline</div><div style="font-size:14px;color:rgba(255,255,255,.75)">Series 2 · Episode 4 · 23 min left</div></div>
<button style="height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;font-size:14px;cursor:pointer;backdrop-filter:blur(20px)">▶ Resume</button></div>
<div style="height:3px;border-radius:3px;background:rgba(255,255,255,.2)"><div style="width:62%;height:3px;border-radius:3px;background:#fff"></div></div></div>
</section>
<div style="flex:1 1 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
${ALSO.map(([a,t,l,p,art])=>`<button class="mini glass" aria-label="Continue ${t} on ${a}"><div style="width:72px;height:100px;flex:none;border-radius:12px;background:${art}"></div><div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1"><div class="small">${a}</div><div style="font-size:16px;font-weight:400">${t}</div><div class="small">${l}</div><div class="track" style="margin-top:6px"><div class="fill" style="width:${p}%"></div></div></div></button>`).join('')}
</div></div></div>
<div style="position:absolute;left:128px;right:48px;bottom:36px;height:112px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px">
${APPS.map(([id,nm,c])=>`<button class="app glass" data-app="${id}" aria-label="${nm}" style="${S.picked===id?`box-shadow:0 0 0 1px ${c},0 0 24px ${c}55`:''}"><span style="width:26px;height:26px;border-radius:8px;background:${c};opacity:.9"></span><span style="font-size:14px;font-weight:400">${nm}</span></button>`).join('')}
</div></div>`;
}
document.getElementById('stage').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.nav)S.nav=b.dataset.nav;
 if(b.dataset.app)S.picked=b.dataset.app;
 if(b.dataset.act==='theme')S.theme=S.theme==='dark'?'light':'dark';
 if(b.dataset.act==='bg')S.bg=S.bg==='photo'?'gradient':'photo';
 if(b.dataset.act==='play')S.playing=!S.playing;
 render();
});
setInterval(()=>{if(S.playing)S.pos=S.pos>=222?0:S.pos+1;render();},1000);
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);document.getElementById('stage').style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();render();
</script>
</body>
</html>
