<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Home Screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
</helmet>
<div style="{{ rootStyle }}">

<sc-if value="{{ isPhoto }}" hint-placeholder-val="{{ false }}">
<div style="{{ photoLabelStyle }}">[ Your photo wallpaper here ]</div>
</sc-if>

<nav aria-label="Main" style="{{ pillStyle }}">
<sc-for list="{{nav}}" as="item" hint-placeholder-count="5">
<button onClick="{{ item.pick }}" aria-label="{{ item.label }}" style="{{ item.style }}">
<sc-if value="{{ item.g.home }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg></sc-if>
<sc-if value="{{ item.g.search }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></sc-if>
<sc-if value="{{ item.g.music }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></sc-if>
<sc-if value="{{ item.g.live }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M9 3l3 3 3-3"/></svg></sc-if>
<sc-if value="{{ item.g.apps }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></sc-if>
<sc-if value="{{ item.g.games }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10a4 4 0 0 1 3.9 4.8l-1 4.7a2 2 0 0 1-3.5.8L14.5 15h-5l-1.9 2.3a2 2 0 0 1-3.5-.8l-1-4.7A4 4 0 0 1 7 7z"/><path d="M8 10v3M6.5 11.5h3"/><circle cx="16" cy="11" r=".6" fill="currentColor"/></svg></sc-if>
</button>
</sc-for>
<div style="{{ dividerStyle }}"></div>
<button aria-label="Wi-Fi" style="{{ iconBtnStyle }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.2" r=".8" fill="currentColor"/></svg>
</button>
<button onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" style="{{ iconBtnStyle }}">
<sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></sc-if>
<sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></sc-if>
</button>
<button onClick="{{ toggleBg }}" aria-label="{{ bgLabel }}" style="{{ iconBtnStyle }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8.5"/></svg>
</button>
<button aria-label="Settings" style="{{ iconBtnStyle }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
</nav>

<div style="position: absolute; left: 128px; right: 48px; top: 36px; display: flex; justify-content: space-between; align-items: baseline">
<div style="display: flex; align-items: baseline; gap: 18px">
<div style="font-size: 52px; font-weight: 200; letter-spacing: -1px; line-height: 1">{{ time }}</div>
<div style="{{ subStyle }}">{{ date }}</div>
</div>
<div style="{{ subStyle }}">12° · Partly cloudy</div>
</div>

<div style="position: absolute; left: 128px; right: 48px; top: 112px; height: 432px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px">

<div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">
<section aria-label="Now playing" style="{{ cardStyle }} height: 262px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between">
<div style="{{ eyebrowStyle }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg>
<span>Now playing · YouTube Music</span>
</div>
<div style="display: flex; gap: 20px; align-items: center">
<div style="width: 112px; height: 112px; flex: none; border-radius: 16px; background: linear-gradient(140deg, #e8735a 0%, #8b3a7a 55%, #2c1d4f 100%); box-shadow: 0 10px 30px rgba(0,0,0,0.35)"></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<div style="font-size: 22px; font-weight: 400; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Late Night Static</div>
<div style="{{ subStyle }}">Neon Harbour</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="{{ trackStyle }}"><div style="{{ songFillStyle }}"></div></div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="{{ smallStyle }}">{{ songElapsed }}</span>
<div style="display: flex; gap: 8px; align-items: center">
<button aria-label="Previous" style="{{ ctrlStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-8 6 8 6zM6 6v12"/></svg></button>
<button onClick="{{ togglePlay }}" aria-label="{{ playLabel }}" style="{{ playBtnStyle }}">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5.5" width="3.2" height="13" rx="1"/><rect x="13.8" y="5.5" width="3.2" height="13" rx="1"/></svg></sc-if>
<sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></sc-if>
</button>
<button aria-label="Next" style="{{ ctrlStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l8 6-8 6zM18 6v12"/></svg></button>
</div>
<span style="{{ smallStyle }}">3:42</span>
</div>
</div>
</section>

<section aria-label="Weather" style="{{ cardStyle }} flex: 1 1 0; padding: 22px; display: flex; justify-content: space-between; align-items: stretch">
<div style="display: flex; flex-direction: column; justify-content: space-between">
<div style="{{ eyebrowStyle }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
<span>[Your town]</span>
</div>
<div style="font-size: 64px; font-weight: 200; line-height: 1; letter-spacing: -2px">12°</div>
<div style="{{ smallStyle }}">Partly cloudy · H 14° L 8°</div>
</div>
<svg width="96" height="96" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="align-self: center; opacity: 0.85"><circle cx="18" cy="17" r="6"/><path d="M18 6v2.5M7 17h2.5M10.2 9.2l1.8 1.8M25.8 9.2L24 11"/><path d="M16 36h20a6 6 0 0 0 0-12 8.5 8.5 0 0 0-16.2 2.5A5 5 0 0 0 16 36z"/></svg>
</section>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">
<section aria-label="Continue watching" style="{{ cardStyle }} height: 280px; position: relative; overflow: hidden; padding: 0">
<div style="position: absolute; inset: 0; background: linear-gradient(130deg, #1e6a7a 0%, #24315e 50%, #4a1f4e 100%)"></div>
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(4,4,8,0.85) 0%, rgba(4,4,8,0.2) 60%, rgba(4,4,8,0) 100%)"></div>
<div style="position: absolute; left: 24px; top: 20px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; letter-spacing: 0.4px; color: rgba(255,255,255,0.8)">Continue watching</div>
<div style="position: absolute; left: 24px; right: 24px; bottom: 22px; display: flex; flex-direction: column; gap: 10px; color: #ffffff">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.75)">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #ff4fa3"></span>
<span>BBC iPlayer</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="font-size: 30px; font-weight: 300; letter-spacing: -0.4px">The Coastline</div>
<div style="font-size: 14px; font-weight: 300; color: rgba(255,255,255,0.75)">Series 2 · Episode 4 · 23 min left</div>
</div>
<button aria-label="Resume The Coastline" style="flex: none; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.14); color: #fff; font-size: 14px; font-weight: 400; display: flex; align-items: center; gap: 8px; cursor: pointer; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px)">
<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>
Resume
</button>
</div>
<div style="height: 3px; border-radius: 3px; background: rgba(255,255,255,0.2)"><div style="width: 62%; height: 3px; border-radius: 3px; background: #ffffff"></div></div>
</div>
</section>

<div style="flex: 1 1 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{alsoWatching}}" as="w" hint-placeholder-count="2">
<button aria-label="{{ w.aria }}" style="{{ w.style }}">
<div style="{{ w.artStyle }}"></div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 0; text-align: left">
<div style="{{ smallStyle }}">{{ w.app }}</div>
<div style="font-size: 16px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ w.title }}</div>
<div style="{{ smallStyle }}">{{ w.left }}</div>
<div style="{{ trackStyle }} margin-top: 6px"><div style="{{ w.fillStyle }}"></div></div>
</div>
</button>
</sc-for>
</div>
</div>
</div>

<div style="position: absolute; left: 128px; right: 48px; bottom: 36px; height: 112px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{apps}}" as="app" hint-placeholder-count="7">
<button onClick="{{ app.pick }}" aria-label="{{ app.name }}" style="{{ app.style }}">
<span style="{{ app.dotStyle }}"></span>
<span style="font-size: 14px; font-weight: 400; white-space: nowrap">{{ app.name }}</span>
</button>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'dark', bg: 'gradient', nav: 'home', picked: 'youtube', playing: true, pos: 83, now: new Date() };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const next = { now: new Date() };
      if (this.state.playing) next.pos = this.state.pos >= 222 ? 0 : this.state.pos + 1;
      this.setState(next);
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const dark = this.state.theme === 'dark';
    const photo = this.state.bg === 'photo';
    const ink = dark ? '#ececf1' : '#15151d';
    const sub = dark ? 'rgba(236,236,241,0.62)' : 'rgba(21,21,29,0.62)';
    const blur = 'backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);';
    const glass = dark
      ? 'background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);'
      : 'background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.85);';
    const shadow = dark ? 'box-shadow: 0 20px 50px rgba(0,0,0,0.45);' : 'box-shadow: 0 14px 40px rgba(40,40,80,0.08);';

    const gradDark = 'radial-gradient(ellipse at 10% 0%, rgba(84,58,150,0.32) 0%, rgba(84,58,150,0) 50%), radial-gradient(ellipse at 95% 5%, rgba(28,64,140,0.28) 0%, rgba(28,64,140,0) 50%), radial-gradient(ellipse at 75% 105%, rgba(150,62,38,0.2) 0%, rgba(150,62,38,0) 50%), #050508';
    const gradLight = 'radial-gradient(ellipse at 10% 0%, #f7d5cc 0%, rgba(247,213,204,0) 50%), radial-gradient(ellipse at 95% 5%, #cdd6fb 0%, rgba(205,214,251,0) 50%), radial-gradient(ellipse at 75% 105%, #fbe3c6 0%, rgba(251,227,198,0) 50%), #eff0f5';
    const bgFill = photo ? (dark ? 'linear-gradient(135deg, #1c1c22, #0b0b0f)' : 'linear-gradient(135deg, #e4e4ea, #d0d1d8)') : (dark ? gradDark : gradLight);

    const navList = [
      { id: 'home', label: 'Home' }, { id: 'search', label: 'Search' }, { id: 'music', label: 'Music' },
      { id: 'live', label: 'Live TV' }, { id: 'apps', label: 'All apps' }, { id: 'games', label: 'Games' }
    ];
    const iconBtnBase = 'width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease, color 0.2s ease;';
    const nav = navList.map((n) => {
      const on = this.state.nav === n.id;
      const g = { home: false, search: false, music: false, live: false, apps: false, games: false };
      g[n.id] = true;
      return {
        label: n.label, g,
        pick: () => this.setState({ nav: n.id }),
        style: iconBtnBase + (on ? (dark ? 'background: rgba(255,255,255,0.12); color: #ffffff;' : 'background: rgba(21,21,29,0.08); color: #15151d;') : 'background: transparent; color: ' + sub + ';')
      };
    });

    const appList = [
      { id: 'youtube', name: 'YouTube', c: '#ff3b3b' }, { id: 'iplayer', name: 'iPlayer', c: '#ff4fa3' },
      { id: 'itvx', name: 'ITVX', c: '#e6c341' }, { id: 'c4', name: 'Channel 4', c: '#47c98f' },
      { id: 'my5', name: 'My5', c: '#4f8fff' }, { id: 'prime', name: 'Prime Video', c: '#38b6f0' },
      { id: 'ytmusic', name: 'YT Music', c: '#ff5a5a' }
    ];
    const apps = appList.map((a) => {
      const on = this.state.picked === a.id;
      return {
        name: a.name,
        pick: () => this.setState({ picked: a.id }),
        dotStyle: 'width: 26px; height: 26px; border-radius: 8px; background: ' + a.c + '; opacity: 0.9;',
        style: 'border-radius: 22px; cursor: pointer; padding: 0; color: ' + ink + '; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; ' + blur + glass + (on ? 'box-shadow: 0 0 0 1px ' + a.c + ', 0 0 24px ' + a.c + '55;' : '') + ' transition: box-shadow 0.2s ease;'
      };
    });

    const also = [
      { app: 'Prime Video', title: 'Northbound', left: '1h 12m left', pct: 38, art: 'linear-gradient(150deg, #3b5f8a, #121a2c)' },
      { app: 'ITVX', title: 'Kitchen Nights', left: 'S1 · E2 · 8 min left', pct: 84, art: 'linear-gradient(150deg, #b0743a, #3a1f14)' }
    ];
    const alsoWatching = also.map((w) => ({
      app: w.app, title: w.title, left: w.left,
      aria: 'Continue ' + w.title + ' on ' + w.app,
      style: 'border-radius: 24px; cursor: pointer; padding: 16px; color: ' + ink + '; display: flex; gap: 14px; align-items: center; min-width: 0; font-family: inherit; ' + blur + glass,
      artStyle: 'width: 72px; height: 100px; flex: none; border-radius: 12px; background: ' + w.art + ';',
      fillStyle: 'width: ' + w.pct + '%; height: 3px; border-radius: 3px; background: ' + ink + ';'
    }));

    const n = this.state.now;
    const pad = (x) => String(x).padStart(2, '0');
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const pos = this.state.pos;

    return {
      nav, apps, alsoWatching,
      isDark: dark, isLight: !dark, isPhoto: photo,
      playing: this.state.playing, paused: !this.state.playing,
      time: pad(n.getHours()) + ':' + pad(n.getMinutes()),
      date: days[n.getDay()] + ' ' + n.getDate() + ' ' + months[n.getMonth()],
      songElapsed: Math.floor(pos / 60) + ':' + pad(pos % 60),
      themeLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
      bgLabel: photo ? 'Use gradient wallpaper' : 'Use photo wallpaper',
      playLabel: this.state.playing ? 'Pause' : 'Play',
      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' }),
      toggleBg: () => this.setState({ bg: photo ? 'gradient' : 'photo' }),
      togglePlay: () => this.setState({ playing: !this.state.playing }),
      rootStyle: 'width: 1280px; height: 720px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; font-weight: 300; color: ' + ink + '; background: ' + bgFill + '; transition: background 0.4s ease;',
      photoLabelStyle: 'position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: ' + sub + ';',
      pillStyle: 'position: absolute; left: 32px; top: 50%; transform: translateY(-50%); width: 60px; box-sizing: border-box; padding: 10px 8px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; gap: 6px; ' + blur + glass + shadow,
      dividerStyle: 'width: 22px; height: 1px; margin: 6px 0; background: ' + (dark ? 'rgba(255,255,255,0.12)' : 'rgba(21,21,29,0.12)') + ';',
      iconBtnStyle: iconBtnBase + 'background: transparent; color: ' + sub + ';',
      cardStyle: 'box-sizing: border-box; border-radius: 28px; ' + blur + glass + shadow,
      eyebrowStyle: 'display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; letter-spacing: 0.3px; color: ' + sub + ';',
      subStyle: 'font-size: 15px; font-weight: 300; color: ' + sub + ';',
      smallStyle: 'font-size: 13px; font-weight: 300; color: ' + sub + ';',
      trackStyle: 'height: 3px; border-radius: 3px; background: ' + (dark ? 'rgba(255,255,255,0.12)' : 'rgba(21,21,29,0.12)') + ';',
      songFillStyle: 'width: ' + Math.round(pos / 222 * 100) + '%; height: 3px; border-radius: 3px; background: ' + ink + ';',
      ctrlStyle: 'width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: transparent; color: ' + ink + '; display: flex; align-items: center; justify-content: center;',
      playBtnStyle: 'width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: ' + ink + '; color: ' + (dark ? '#050508' : '#ffffff') + '; display: flex; align-items: center; justify-content: center;'
    };
  }
}
</script>
</body>
